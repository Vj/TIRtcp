metadata:
  schema_version: 1.0.0
  last_verified: '2026-11-26'
native_libraries:
  OpenSSL:
    pattern: \bOpenSSL\s+([0-9]+\.[0-9]+\.[0-9]+[a-z]?)\b
    severity: High
    advisory: Legacy or unpatched OpenSSL branches expose thick clients to TLS downgrade
      and memory-safety CVEs.
    branches:
    - prefix: 1.0.
      status: eol
      min_safe: 1.0.2zk
    - prefix: 1.1.
      status: eol
      min_safe: 1.1.1w
    - prefix: 3.0.
      status: lts
      min_safe: 3.0.15
    - prefix: 3.1.
      status: eol
      min_safe: 3.1.7
    - prefix: 3.2.
      status: supported
      min_safe: 3.2.3
    - prefix: 3.3.
      status: supported
      min_safe: 3.3.2
    - prefix: 3.4.
      status: supported
      min_safe: 3.4.0
  libcurl:
    pattern: \blibcurl/([0-9]+\.[0-9]+\.[0-9]+)\b
    severity: High
    advisory: Outdated libcurl releases are affected by SOCKS5 heap overflow and HTTP/2
      framing vulnerabilities.
    branches:
    - prefix: '7.'
      status: eol
      min_safe: 8.10.0
    - prefix: '8.'
      status: supported
      min_safe: 8.10.0
  zlib:
    pattern: \b(?:inflate|deflate)\s+([0-9]+\.[0-9]+\.[0-9]+)\s+Copyright 1995-
    severity: Medium
    advisory: zlib versions prior to 1.3.1 are affected by inflate/deflate memory
      corruption issues.
    branches:
    - prefix: 1.2.
      status: eol
      min_safe: 1.3.1
    - prefix: 1.3.
      status: supported
      min_safe: 1.3.1
  SQLite:
    pattern: \bSQLite\s+(?:version\s+)?(3\.[0-9]+\.[0-9]+)\b
    severity: Medium
    advisory: Outdated embedded SQLite engines expose local client databases to memory
      safety flaws.
    branches:
    - prefix: '3.'
      status: supported
      min_safe: 3.46.0
electron:
  min_supported_major: 31
  supported_majors:
  - 31
  - 32
  - 33
  advisory: Unsupported Electron versions bundle end-of-life Chromium/V8 engines.
native_library_baselines:
  openssl:
    min_safe_version: 3.0.15
    notes: Flags OpenSSL 1.0.x/1.1.1 EOL and pre-3.0.15 CVEs
  libcurl:
    min_safe_version: 8.10.0
    notes: Flags heap/SOCKS5/HTTP2 CVEs in older libcurl DLLs
  sqlite3:
    min_safe_version: 3.46.1
    notes: Flags memory corruption CVEs in bundled sqlite3.dll
  zlib:
    min_safe_version: 1.3.1
    notes: Flags CVE-2022-37434 and pre-1.3.1 inflate overflows
  libcef:
    min_safe_version: 128.0.0
    notes: Flags Chromium Embedded Framework sandbox/V8 CVEs
  qt5core:
    min_safe_version: 5.15.17
    notes: Flags EOL Qt5 runtime DLLs
