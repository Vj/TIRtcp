[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tirtcp"
version = "0.1.0"
description = "Thick Client Penetration Testing & Regulatory Compliance Assessment Suite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - Internal Security Assessment Tool" }
dependencies = [
    "PyYAML>=6.0.1",
    "lief>=0.14.0",
    "pefile>=2023.2.7",
]

[project.optional-dependencies]
network = [
    "scapy>=2.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
tirtcp = "analyzer.tirtcp:main"

[tool.setuptools.packages.find]
include = ["analyzer*", "collector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"